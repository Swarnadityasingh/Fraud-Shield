<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- FraudShield Brand Identity -->
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/branding/favicon-16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/branding/favicon-32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="512x512"
      href="/branding/app-icon.png"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&family=Playwrite+IT+Trad:wght@400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Browser Theme -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#070D18" />

    <!-- Primary SEO -->
    <title>FraudShield | Financial Risk Intelligence</title>
    <meta
      name="description"
      content="FraudShield - Machine Learning Based Financial Risk Assessment and Real-Time Fraud Detection Framework."
    />

    <!-- Open Graph / Social Media Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FraudShield | Financial Risk Intelligence" />
    <meta property="og:description" content="Real-time transaction anomaly monitoring and AI-driven financial fraud protection." />
    <meta property="og:image" content="/branding/app-icon.png" />

    <!-- Prevent Initial White Screen Flash -->
    <style>
      html,
      body,
      #root {
        background-color: #070D18 !important;
        color: #F1F5F9;
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
